name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run electron:build -- --publish never

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            $version = $tag -replace '^v', ''
            gh release create $tag --verify-tag --title $version --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release $tag"
            }
          }

          $assets = @(
            Get-ChildItem -Path release -File |
              Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } |
              ForEach-Object { $_.FullName }
          )
          if (-not ($assets | Where-Object { $_ -match '\.exe$' })) {
            throw "No Windows installer was produced for $tag"
          }

          gh release upload $tag $assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for $tag"
          }
